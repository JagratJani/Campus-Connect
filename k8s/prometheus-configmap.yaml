apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: lab8
  labels:
    app: prometheus
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/part-of: campusconnect-system
data:
  prometheus.yml: |
    global:
      scrape_interval: 5s
      evaluation_interval: 5s

    scrape_configs:
      - job_name: "gateway"
        metrics_path: "/metrics"
        static_configs:
          - targets: ["api-gateway:3000"]
            labels:
              service: "api-gateway"
              tier: "entrypoint"

      - job_name: "user-service"
        metrics_path: "/metrics"
        static_configs:
          - targets: ["user-service:3001"]
            labels:
              service: "user-service"
              tier: "backend"

      - job_name: "product-service"
        metrics_path: "/metrics"
        static_configs:
          - targets: ["product-service:3002"]
            labels:
              service: "product-service"
              tier: "backend"

      - job_name: "order-service"
        metrics_path: "/metrics"
        static_configs:
          - targets: ["order-service:3003"]
            labels:
              service: "order-service"
              tier: "backend"
