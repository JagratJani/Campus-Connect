apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards
  namespace: lab8
  labels:
    app: grafana
    app.kubernetes.io/name: grafana
    app.kubernetes.io/part-of: campusconnect-system
data:
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: 'CampusConnect Dashboards'
        orgId: 1
        folder: ''
        type: file
        disableDeletion: false
        editable: true
        options:
          path: /var/lib/grafana/dashboards
  campusconnect-dashboard.json: |
    {
      "annotations": { "list": [] },
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 0,
      "id": null,
      "links": [],
      "liveNow": false,
      "panels": [
        {
          "type": "stat",
          "title": "Services Up & Healthy (Target Availability)",
          "gridPos": { "h": 6, "w": 6, "x": 0, "y": 0 },
          "id": 1,
          "targets": [
            {
              "expr": "sum(up{namespace=\"lab8\"})",
              "legendFormat": "Active Targets",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "thresholds" },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "red", "value": null },
                  { "color": "green", "value": 4 }
                ]
              }
            }
          }
        },
        {
          "type": "stat",
          "title": "Total API Requests Processed",
          "gridPos": { "h": 6, "w": 6, "x": 6, "y": 0 },
          "id": 2,
          "targets": [
            {
              "expr": "sum(http_requests_total)",
              "legendFormat": "Total Requests",
              "refId": "A"
            }
          ]
        },
        {
          "type": "stat",
          "title": "Total Errors (4xx & 5xx)",
          "gridPos": { "h": 6, "w": 6, "x": 12, "y": 0 },
          "id": 3,
          "targets": [
            {
              "expr": "sum(http_requests_total{status=~\"[45]..\"}) or vector(0)",
              "legendFormat": "Errors",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "thresholds" },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "red", "value": 1 }
                ]
              }
            }
          }
        },
        {
          "type": "stat",
          "title": "Avg Request Latency (ms)",
          "gridPos": { "h": 6, "w": 6, "x": 18, "y": 0 },
          "id": 4,
          "targets": [
            {
              "expr": "(sum(rate(http_request_duration_seconds_sum[1m])) / sum(rate(http_request_duration_seconds_count[1m]))) * 1000 or vector(0)",
              "legendFormat": "Avg Latency (ms)",
              "refId": "A"
            }
          ]
        },
        {
          "type": "timeseries",
          "title": "API Traffic Rate (req/sec by Route)",
          "gridPos": { "h": 9, "w": 12, "x": 0, "y": 6 },
          "id": 5,
          "targets": [
            {
              "expr": "sum by (route) (rate(http_requests_total[1m]))",
              "legendFormat": "{{route}}",
              "refId": "A"
            }
          ]
        },
        {
          "type": "timeseries",
          "title": "HTTP Status Code Distribution",
          "gridPos": { "h": 9, "w": 12, "x": 12, "y": 6 },
          "id": 6,
          "targets": [
            {
              "expr": "sum by (status) (rate(http_requests_total[1m]))",
              "legendFormat": "HTTP {{status}}",
              "refId": "A"
            }
          ]
        }
      ],
      "schemaVersion": 38,
      "style": "dark",
      "tags": ["lab8", "campusconnect"],
      "time": { "from": "now-15m", "to": "now" },
      "timepicker": { "refresh_intervals": ["5s", "10s", "30s"] },
      "timezone": "browser",
      "title": "Lab 8 - CampusConnect Microservices & Gateway Monitoring"
    }
