apiVersion: v1
kind: ConfigMap
metadata:
  name: campus-config
  namespace: lab8
  labels:
    app.kubernetes.io/name: campusconnect
    app.kubernetes.io/part-of: campusconnect-system
data:
  # Service ports
  GATEWAY_PORT: "3000"
  USER_SERVICE_PORT: "3001"
  PRODUCT_SERVICE_PORT: "3002"
  ORDER_SERVICE_PORT: "3003"
  
  # Kubernetes Service Discovery URLs (stable internal DNS names)
  USER_SERVICE_URL: "http://user-service:3001"
  PRODUCT_SERVICE_URL: "http://product-service:3002"
  ORDER_SERVICE_URL: "http://order-service:3003"

  # Persistence & Runtime
  DATA_DIR: "/app/data"
  NODE_ENV: "production"
